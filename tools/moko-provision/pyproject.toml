[project]
name = "moko"
version = "0.1.0"
description = "Provision MokoSmart BeaconX Pro BLE tags over BLE through an ESPHome Bluetooth proxy"
requires-python = ">=3.13"
# The BLE stack is pinned EXACTLY to the versions proven on hardware through the same
# ESPHome proxy by tools/gl-s10-provision. bleak 3.1 / bleak-esphome 4.1 crash on
# disconnected_callback. Upgrade these together, and only with a live `moko read`.
dependencies = [
    "aioesphomeapi==46.0.0",
    "bleak==3.0.2",
    "bleak-esphome==4.0.0",
    "bleak-retry-connector==4.6.3",
    "habluetooth==6.26.7",
    "cryptography>=48.0.1",
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    # The shared radio lock and the broker credentials (gls10.lock, gls10.creds).
    "gls10",
]

[tool.uv.sources]
gls10 = { path = "../gl-s10-provision" }

[project.scripts]
moko = "moko.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
