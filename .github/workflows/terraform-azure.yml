name: terraform-azure
#
# DORMANT while the AKS stack is deprovisioned (TRA-976, 2026-06-10). The
# burn-down destroyed the `trakrf-infra-ci` app registration this workflow logs
# in as, so `azure/login` fails with AADSTS700016 before any Terraform runs, and
# `terraform/azure` state is empty — even a working login would only ever plan a
# full create of a stack that is deliberately gone. The `plan` job stood red on
# every PR touching terraform/azure/ for a month before anyone noticed, because
# it is not a required check (TRA-1220).
#
# To bring it back when Azure returns:
#   1. Re-apply terraform/azure/ci.tf to recreate the app registration, its two
#      federated credentials and the Contributor assignment. Import the
#      preserved DNS zone and rg-trakrf-demo-ussc first — see TRA-976.
#   2. Set the AZURE_CLIENT_ID repository secret to the new application's id.
#   3. Set repository variable AZURE_STACK_ACTIVE=true. No PR needed.
#
# Until step 3, `plan` skips and reports neutral rather than red. Credential-free
# validation of terraform/azure is unaffected: ci.yml runs `tofu fmt` and
# `tofu validate` over that root on every PR, and always has.
#
# scripts/check-pr-cloud-auth.sh enforces that a PR-reachable cloud login always
# carries a switch like this one.

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/azure/**'
      - '.github/workflows/terraform-azure.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm'
        required: true

concurrency:
  group: terraform-azure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ARM_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID:    ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:           "true"
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AWS_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT:            https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  plan:
    # AZURE_STACK_ACTIVE is unset while the stack is deprovisioned, so this
    # skips (neutral) instead of failing at azure/login. See the header.
    if: github.event_name == 'pull_request' && vars.AZURE_STACK_ACTIVE == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/azure
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version
      - name: Write backend.conf
        run: printf 'endpoints = { s3 = "%s" }\n' "$R2_ENDPOINT" > backend.conf
      - name: Tofu init
        run: tofu init -backend-config=backend.conf
      - name: Tofu plan
        shell: bash
        run: |
          set -o pipefail
          tofu plan -refresh=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const plan = fs.readFileSync('terraform/azure/plan_output.txt', 'utf8');
              const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n...(truncated)' : plan;
              body = `### Terraform Plan (terraform/azure)\n\n\`\`\`\n${truncated}\n\`\`\``;
            } catch (err) {
              body = `### Terraform Plan (terraform/azure)\n\nPlan output unavailable (likely a job failure before plan completed). See the workflow logs for details.\n\nError: \`${err.message}\``;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'APPLY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/azure
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version
      - name: Write backend.conf
        run: printf 'endpoints = { s3 = "%s" }\n' "$R2_ENDPOINT" > backend.conf
      - name: Tofu init
        run: tofu init -backend-config=backend.conf
      - name: Tofu apply
        run: tofu apply -refresh=false -auto-approve
