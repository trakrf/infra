# helm/monitoring/values.yaml
# Overrides for prometheus-community/kube-prometheus-stack.
# Pinned chart version is enforced by `just monitoring-bootstrap`, not here.

fullnameOverride: kube-prometheus-stack

# Discover ServiceMonitors / PodMonitors / PrometheusRules in any namespace,
# without requiring our app charts to add a release-specific label.
# Tolerate webhook unavailability — avoids deadlock where ServiceMonitor /
# PrometheusRule applies fail because the operator's webhook pod is down.
prometheusOperator:
  admissionWebhooks:
    failurePolicy: Ignore
    patch:
      enabled: true

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 15d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 1,    memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  # The chart default routes every alert to "null". Route them to Slack instead;
  # the webhook URL lives in the alertmanager-slack Secret (`just
  # alertmanager-secrets`), mounted below. See README.md for setup and rotation.
  # Helm merges these maps into the chart default, but replaces lists, so
  # route.routes and receivers here are the whole set; the chart's
  # inhibit_rules and templates glob are kept.
  config:
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # Anything not matched below, including alerts with no severity label.
      receiver: slack-warning
      routes:
        # Watchdog fires constantly by design, to prove the pipeline is alive.
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # info / none are the chart's advisory alerts (CPUThrottlingHigh,
        # InfoInhibitor, …) — visible in the Alertmanager UI, not worth a post.
        - receiver: 'null'
          matchers:
            - severity =~ "info|none"
        - receiver: slack-critical
          matchers:
            - severity = "critical"
          repeat_interval: 1h
    receivers:
      - name: 'null'
      - name: slack-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            title: '{{ template "trakrf.slack.title" . }}'
            text: '{{ template "trakrf.slack.text" . }}'
      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '{{ template "trakrf.slack.title" . }}'
            text: '{{ if eq .Status "firing" }}<!channel> {{ end }}{{ template "trakrf.slack.text" . }}'
  # Mounted by the chart at /etc/alertmanager/config/, which the chart's
  # templates glob already loads.
  templateFiles:
    trakrf-slack.tmpl: |-
      {{ define "trakrf.slack.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}
      {{- end }}
      {{ define "trakrf.slack.text" -}}
      {{ range .Alerts -}}
      *{{ .Labels.severity | toUpper }}* {{ .Annotations.summary }}
      {{ with .Annotations.description }}{{ . }}
      {{ end }}{{ with .Labels.pod }}pod: `{{ . }}`
      {{ end }}{{ end -}}
      {{- end }}
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<name>/. The pod will not start
    # without it, so `just monitoring-bootstrap` checks for it first.
    secrets:
      - alertmanager-slack
    resources:
      requests: { cpu: 50m,  memory: 64Mi }
      limits:   { cpu: 200m, memory: 128Mi }
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  defaultDashboardsEnabled: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  persistence:
    enabled: true
    size: 5Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
