# Host-specific Certificate for grafana.gke.trakrf.id on GKE.
# Issued via the cert-manager Cloud DNS solver established in the gke.trakrf.id
# DNS foundation. The Secret lands in the monitoring namespace so the sibling
# IngressRoute can reference it directly (Traefik TLSStore refs are
# namespace-scoped; the wildcard cert lives in cert-manager ns and can't be
# reached cross-namespace).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-gke-trakrf-id
  namespace: monitoring
spec:
  secretName: grafana-gke-trakrf-id-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: grafana.gke.trakrf.id
  dnsNames:
    - grafana.gke.trakrf.id
