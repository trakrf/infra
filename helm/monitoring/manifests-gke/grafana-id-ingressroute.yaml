# Public ingress for Grafana on the consolidated trakrf.id zone (TRA-830).
# Dual-served alongside the legacy grafana.gke.trakrf.app route until DNS
# soak completes, then the .app variant is retired. Uses an explicit
# tls.secretName so the .id host gets its own LE cert instead of falling
# back to Traefik's default TLSStore (which is bound to the .app wildcard).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-id
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.gke.trakrf.id`)
      kind: Rule
      middlewares:
        - name: default-chain
          namespace: traefik
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-gke-trakrf-id-tls
