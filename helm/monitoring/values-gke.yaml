# helm/monitoring/values-gke.yaml
# GKE-specific monitoring overrides — premium-rwo storage + GKE Grafana host +
# per-subcomponent ARM tolerations (GKE auto-taints ARM pools; AKS does not).
# See TRA-470 and memory feedback_gke_arm_auto_taint.

prometheus:
  prometheusSpec:
    # TRA-894: prod + preview share this GKE cluster and one kube-prometheus-stack.
    # trakrf-backend/trakrf-ingester emit a ServiceMonitor into every env namespace,
    # so default cluster-wide discovery would scrape the intentionally-unmonitored
    # trakrf-preview targets. Restrict target discovery to every namespace EXCEPT
    # trakrf-preview (exclude-list is robust against future infra namespaces).
    # kubernetes.io/metadata.name is auto-set by k8s on every namespace (GA).
    serviceMonitorNamespaceSelector: &notPreview
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: [trakrf-preview] }
    podMonitorNamespaceSelector: *notPreview
    probeNamespaceSelector: *notPreview
    scrapeConfigNamespaceSelector: *notPreview
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: premium-rwo
    tolerations:
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: premium-rwo
    tolerations:
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule

grafana:
  persistence:
    storageClassName: premium-rwo
  grafana.ini:
    server:
      domain: grafana.trakrf.id
      root_url: https://grafana.trakrf.id
  tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule

prometheusOperator:
  tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule
  admissionWebhooks:
    patch:
      tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule

kube-state-metrics:
  tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule

prometheus-node-exporter:
  tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule
