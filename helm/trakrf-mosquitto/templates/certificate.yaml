apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "trakrf-mosquitto.fullname" . }}-mqtt
  labels:
    {{- include "trakrf-mosquitto.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certSecret }}
  # Host-specific cert, not wildcard. The GL-S10's minimal mbedTLS build has
  # inconsistent wildcard-SAN matching; host-specific avoids the issue.
  commonName: {{ .Values.hostname }}
  dnsNames:
    - {{ .Values.hostname }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
