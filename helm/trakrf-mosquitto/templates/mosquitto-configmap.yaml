apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trakrf-mosquitto.fullname" . }}
  labels:
    {{- include "trakrf-mosquitto.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    # Per-listener auth (so the loopback plain listener can require auth too).
    per_listener_settings true

    # Loopback-only plain listener for the metrics exporter sidecar.
    # Authenticated; never reachable from outside the pod (bound to 127.0.0.1).
    listener 1883 127.0.0.1
    allow_anonymous false
    password_file /mosquitto/auth/passwd

    # Public TLS listener. cert-manager mounts the cert Secret at /mosquitto/tls.
    # TLS 1.2 only — the GL-S10 BLE gateway's mbedTLS build is 1.2-only and a
    # 1.3-floor would brick it. See TRA-827.
    listener 8883 0.0.0.0
    protocol mqtt
    certfile /mosquitto/tls/tls.crt
    keyfile  /mosquitto/tls/tls.key
    tls_version tlsv1.2
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    acl_file /mosquitto/config/acl
    {{- if .Values.websocket.enabled }}

    # WebSocket (TLS) listener — RETIRED by TRA-924 (disabled via
    # websocket.enabled=false). Live Reads moved to a backend SSE proxy; nothing
    # connects to the broker from the browser. Block kept inert for reversibility.
    # NOTE: the `frontend-readonly` user no longer exists — re-enabling this
    # listener would need a fresh ACL identity and must stay cluster-internal.
    listener {{ .Values.websocket.port }} 0.0.0.0
    protocol websockets
    certfile /mosquitto/tls/tls.crt
    keyfile  /mosquitto/tls/tls.key
    tls_version tlsv1.2
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    acl_file /mosquitto/config/acl
    {{- end }}

    # Stateless broker — current device traffic is QoS 0, so persistence is
    # inert. Sidesteps the zonal-PD AZ-orphan trap (TRA-364). emptyDir is
    # mounted at persistence_location to satisfy the directive even when off.
    persistence false
    persistence_location /mosquitto/data/

    # Log to stdout so kubectl logs sees broker events.
    log_dest stdout
  # Per-user ACL applied on the public :8883 listener. The loopback :1883
  # listener has no acl_file, so the metrics exporter's $SYS reads stay
  # unrestricted. trakrf-mqtt stays broad (backend subscriber + TRA-906 command
  # publisher + readers — unchanged). The TRA-902 `frontend-readonly` user was
  # retired in TRA-924 (browser no longer touches the broker). TRA-857 tracks
  # tighter per-user scoping.
  acl: |
    user trakrf-mqtt
    topic readwrite #
