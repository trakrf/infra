# Common CNPG+Timescale defaults. Storage class + affinity per cluster overlay.
# Managed role passwordSecrets (4 of them, one per env-role pair) are
# created out-of-band by `just db-secrets` — do not template them here.

fullnameOverride: trakrf-db

cluster:
  instances: 1
  imageName: ghcr.io/clevyr/cloudnativepg-timescale:17.2-ts2.18

postgresql:
  sharedPreloadLibraries:
    - timescaledb
  parameters:
    timescaledb.license: timescale
    password_encryption: scram-sha-256

# `initdb` bootstraps a single Postgres database. We use trakrf_preview as
# the initial DB so its owner role (trakrf-migrate-preview) is also created
# by initdb. The trakrf_prod database is created later by a Database CRD
# (templates/databases.yaml) and its roles by `managed.roles` below.
bootstrap:
  initdb:
    database: trakrf_preview
    owner: trakrf-migrate-preview
    postInitTemplateSQL:
      - CREATE EXTENSION IF NOT EXISTS timescaledb
    postInitSQL: []
    # All schema/grants are applied by per-env post-install Jobs
    # (templates/init-grants-job.yaml) so the bootstrap path and the
    # second-DB path use one source of truth.
    postInitApplicationSQL: []

# Each entry defines one Postgres database and its role pair.
# Database CRD (templates/databases.yaml) and managed-role list
# (templates/cluster.yaml) both range over this.
envs:
  - name: preview
    database: trakrf_preview          # Postgres DB name (underscore)
    cnpgDatabaseName: trakrf-preview  # K8s Database CRD metadata.name (hyphen)
    appRole: trakrf-app-preview
    migrateRole: trakrf-migrate-preview
    appSecret: trakrf-app-preview-credentials
    migrateSecret: trakrf-migrate-preview-credentials
    reflectTo: trakrf-preview
  - name: prod
    database: trakrf_prod
    cnpgDatabaseName: trakrf-prod
    appRole: trakrf-app-prod
    migrateRole: trakrf-migrate-prod
    appSecret: trakrf-app-prod-credentials
    migrateSecret: trakrf-migrate-prod-credentials
    reflectTo: trakrf-prod

# Init-grants Job knobs (one Job per env via templates/init-grants-job.yaml)
initGrantsJob:
  # CNPG ships psql in its postgresql image
  image: ghcr.io/cloudnative-pg/postgresql:17.2
  # The DB host the Job connects to — CNPG service in the chart's namespace
  host: trakrf-db-rw

storage:
  size: 10Gi
  class: ""              # REQUIRED — set in values-<cluster>.yaml

affinity:
  nodeSelector: {}
  tolerations: []

# Phase 1 logical per-DB dumps to GCS. Off by default — only the GKE
# overlay turns it on (values-gke.yaml). Bucket name + GSA email are
# injected by the root chart from tofu outputs (see
# argocd/root/templates/trakrf-db.yaml).
backups:
  enabled: false
  bucket: ""
  gcpServiceAccountEmail: ""
  schedule: "0 9 * * *"   # daily @ 09:00 UTC
  # Retention is enforced by the GCS lifecycle rule on the bucket
  # (terraform/gcp/cnpg_backups.tf). retentionDays here is documentation
  # only — changing it does NOT change behavior.
  retentionDays: 14
  # Two-container pattern. The CNPG postgres image runs pg_dump into an
  # emptyDir volume; a tiny curl image uploads to GCS via the JSON API
  # using a Workload Identity access token from the GKE metadata server.
  # We use curl (not gcloud) because Google does not publish a multi-arch
  # google/cloud-sdk image — the amd64-only image crashes on ARM nodes.
  pgDumpImage: ghcr.io/cloudnative-pg/postgresql:17.2
  uploadImage: curlimages/curl:8.10.1
  # K8s SA name in the chart's namespace. Must match the WI subject in
  # terraform/gcp/cnpg_backups.tf (trakrf-system/cnpg-backups).
  serviceAccountName: cnpg-backups

  # Phase 2: CNPG-native continuous WAL archiving + scheduled base
  # backups to the same bucket as Phase 1. Off by default; gated
  # separately from Phase 1 so the two layers can be flipped
  # independently. Requires the WI binding in terraform/gcp/cnpg_backups.tf
  # for the cluster's pod SA (google_service_account_iam_member.cnpg_backups_wi_cluster).
  cluster:
    enabled: false
    # Path prefix CNPG writes under inside the bucket. Defaults to the
    # Cluster name; pinning it explicitly makes WAL/base paths stable
    # across Cluster renames.
    serverName: trakrf-db
    # Schedule for the recurring base backup (5-field cron). The
    # ScheduledBackup template prefixes "0 " to make a 6-field
    # seconds-included cron, which is what CNPG expects (robfig/cron).
    # Staggered 30 min off Phase 1's pg_dump schedule so the two heavy
    # operations don't compete on the single-instance primary.
    baseBackupSchedule: "30 9 * * *"
    # CNPG-native retention. Format "<N>[dwm]". CNPG deletes base
    # backups + their WAL chain atomically. Do NOT add a GCS lifecycle
    # rule for the CNPG paths — it would break WAL chains and PITR.
    retentionPolicy: "14d"

# External LoadBalancer Service for the preview CNPG primary so external
# psql clients can reach it for FDW pull-migration development.
# Disabled by default; the GKE root chart overlay sets enabled=true and
# wires loadBalancerIP + sourceRanges from tofu outputs.
externalPreview:
  enabled: false
  loadBalancerIP: ""
  sourceRanges: []
