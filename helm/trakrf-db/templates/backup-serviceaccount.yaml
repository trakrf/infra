{{- /*
  K8s ServiceAccount that the per-env pg_dump CronJobs run under.
  The iam.gke.io/gcp-service-account annotation pairs this KSA with
  the GCP SA created in terraform/gcp/cnpg_backups.tf so that pods
  using this SA federate to GCP via Workload Identity. Without the
  annotation, the WI binding in terraform exists but no pod actually
  picks it up.

  Gated on .Values.backups.enabled so non-GKE overlays are unaffected.
*/ -}}
{{- if .Values.backups.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backups.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "backups.gcpServiceAccountEmail must be set when backups.enabled=true" .Values.backups.gcpServiceAccountEmail | quote }}
{{- end }}
