{{- /*
  Per-env logical backup CronJob — runs pg_dump against each env DB
  and uploads the result to GCS.

  Two-container pattern:
    initContainer "pg-dump" : CNPG postgres image; pg_dump -Fc into
                              /dump/dump.pgdump on a shared emptyDir.
                              Auth via the env's managed migrate role
                              secret (same Secret the init-grants Job
                              uses).
    main container "gsutil-cp" : google/cloud-sdk:slim; uploads to
                                 gs://<bucket>/<env>/YYYY/MM/DD/HHMM.pgdump
                                 using Workload Identity (the KSA
                                 cnpg-backups is annotated with the
                                 GCP SA).

  Why init+main and not two main containers: K8s requires AT LEAST one
  container in `containers`, and a Job is "succeeded" when all
  containers exit 0. Init containers run sequentially first, which is
  exactly the ordering we want (dump must finish before upload).
*/ -}}
{{- if .Values.backups.enabled }}
{{- $root := . -}}
{{- range $env := .Values.envs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "pg-dump-%s" $env.name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  schedule: {{ $root.Values.backups.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ $root.Values.backups.serviceAccountName | quote }}
          automountServiceAccountToken: true
          {{- with $root.Values.affinity.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.affinity.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: dump
              emptyDir: {}
          initContainers:
            - name: pg-dump
              image: {{ $root.Values.backups.pgDumpImage | quote }}
              env:
                - name: PGHOST
                  value: {{ $root.Values.initGrantsJob.host | quote }}
                - name: PGPORT
                  value: "5432"
                - name: PGSSLMODE
                  value: require
                - name: PGDATABASE
                  value: {{ $env.database | quote }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $env.migrateSecret | quote }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $env.migrateSecret | quote }}
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  pg_dump -Fc -Z 6 -f /dump/dump.pgdump
                  ls -la /dump/dump.pgdump
              volumeMounts:
                - name: dump
                  mountPath: /dump
          containers:
            - name: gsutil-cp
              image: {{ $root.Values.backups.gsutilImage | quote }}
              env:
                - name: ENV_NAME
                  value: {{ $env.name | quote }}
                - name: BUCKET
                  value: {{ required "backups.bucket must be set when backups.enabled=true" $root.Values.backups.bucket | quote }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  ts=$(date -u +%Y/%m/%d/%H%M)
                  dest="gs://${BUCKET}/${ENV_NAME}/${ts}.pgdump"
                  echo "Uploading /dump/dump.pgdump to ${dest}"
                  gcloud storage cp /dump/dump.pgdump "${dest}"
              volumeMounts:
                - name: dump
                  mountPath: /dump
{{- end }}
{{- end }}
