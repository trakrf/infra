{{- /*
  Init grants Job — applies the trakrf schema + grants in the Postgres
  database. Runs as a Helm post-install,post-upgrade hook so it lands after
  the CNPG operator has reconciled the managed roles + Database CR. SQL is
  idempotent so a re-run on every chart upgrade is a no-op once grants are
  in place.
*/ -}}
{{- $host := .Values.initGrantsJob.host -}}
{{- if not $host -}}
{{- $host = printf "%s-rw" (.Values.fullnameOverride | default "trakrf-db") -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-init-grants" (.Values.fullnameOverride | default "trakrf-db") }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      name: {{ printf "%s-init-grants" (.Values.fullnameOverride | default "trakrf-db") }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.affinity.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: psql
          image: {{ .Values.initGrantsJob.image | quote }}
          env:
            - name: PGHOST
              value: {{ $host | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGSSLMODE
              value: require
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.migrate | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.migrate | quote }}
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Wait for managed-role password reconcile (CNPG runs async after
              # Cluster admission). Retry psql until auth succeeds.
              for i in $(seq 1 30); do
                if psql -v ON_ERROR_STOP=1 -c '\q' 2>/dev/null; then
                  break
                fi
                echo "waiting for role password reconcile (attempt $i)..."
                sleep 4
              done
              psql -v ON_ERROR_STOP=1 <<'SQL'
              CREATE SCHEMA IF NOT EXISTS trakrf AUTHORIZATION "{{ .Values.roles.migrate }}";
              REVOKE CONNECT ON DATABASE {{ .Values.database.name }} FROM PUBLIC;
              GRANT CONNECT ON DATABASE {{ .Values.database.name }} TO "{{ .Values.roles.app }}";
              GRANT USAGE ON SCHEMA trakrf TO "{{ .Values.roles.app }}";
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA trakrf
                TO "{{ .Values.roles.app }}";
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA trakrf
                TO "{{ .Values.roles.app }}";
              GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA trakrf
                TO "{{ .Values.roles.app }}";
              ALTER DEFAULT PRIVILEGES FOR ROLE "{{ .Values.roles.migrate }}" IN SCHEMA trakrf
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "{{ .Values.roles.app }}";
              ALTER DEFAULT PRIVILEGES FOR ROLE "{{ .Values.roles.migrate }}" IN SCHEMA trakrf
                GRANT USAGE, SELECT ON SEQUENCES TO "{{ .Values.roles.app }}";
              ALTER DEFAULT PRIVILEGES FOR ROLE "{{ .Values.roles.migrate }}" IN SCHEMA trakrf
                GRANT EXECUTE ON FUNCTIONS TO "{{ .Values.roles.app }}";
              -- The migration ledger, explicitly and read-only. The backend
              -- serves as the app role and reads it for the /health
              -- schema-drift check; unreadable, that check reports a healthy
              -- 200 with the schema block omitted, so "I cannot tell" and
              -- "all clear" become the same payload (TRA-1218). The ledger is
              -- bookkeeping, not application data, so the blanket ON ALL
              -- TABLES grant above is narrowed back to SELECT here.
              --
              -- Guarded on existence: the ledger is created by the
              -- trakrf-backend chart's migrate Job — a separate Helm release,
              -- which hook weights never order this one against — so on a
              -- fresh install it does not exist yet, and an unguarded GRANT
              -- would abort the whole Job under ON_ERROR_STOP=1. There the
              -- ledger instead inherits the default privileges set above,
              -- write included, until the next db-chart upgrade runs this.
              DO $$
              BEGIN
                IF to_regclass('trakrf.schema_migrations') IS NOT NULL THEN
                  EXECUTE 'GRANT SELECT ON trakrf.schema_migrations TO "{{ .Values.roles.app }}"';
                  EXECUTE 'REVOKE INSERT, UPDATE, DELETE ON trakrf.schema_migrations FROM "{{ .Values.roles.app }}"';
                END IF;
              END
              $$;
              SQL
