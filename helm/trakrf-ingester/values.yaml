# Default values for trakrf-ingester.

# Drop the doubled `<release>-<chart>` pod/resource name.
fullnameOverride: trakrf-ingester

replicaCount: 1

# Stock Redpanda Connect image. Pin a specific tag — the platform Dockerfile
# does not currently pin, which is a separate concern (TRA-84 / upstream fix).
image:
  repository: docker.redpanda.com/redpandadata/connect
  tag: "4.40.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  # Redpanda Connect image's `connect` user = UID 10001; required for
  # runAsNonRoot validation (k8s rejects non-numeric image USER).
  runAsUser: 10001
  runAsGroup: 10001

# Database (CNPG) — same pattern as trakrf-backend.
database:
  credentialsSecret: trakrf-app-credentials
  user: trakrf-app
  host: trakrf-db-rw
  port: 5432
  name: trakrf
  sslmode: require
  # See trakrf-backend values for the full rationale; needed so trigger
  # functions resolve sequences in the trakrf schema. Matches the backend
  # ordering (`public,trakrf`) for consistency. TRA-278 will make the
  # schema name itself configurable.
  searchPath: "public,trakrf"

# MQTT config — ingester reaches the broker over loopback (sidecar pattern).
# Credentials come from the broker auth Secret (broker.authSecret), and
# MQTT_URL is composed in-template via $(VAR) env interpolation.
# See feedback_k8s_dsn_composition for the pattern.
mqtt:
  # Non-secret; overridden per-env in argocd/root/templates/trakrf-ingester.yaml
  # so each env logs as a distinct client. Distinct clientIds avoid MQTT's
  # duplicate-eviction loop if the same broker is ever shared across envs.
  # See feedback_mqtt_clientid_per_cluster.
  clientId: trakrf-ingester
  topic: "trakrf/scans/#"
  host: localhost
  port: 1883
  user: trakrf-ingester

# Mosquitto sidecar (TRA-828). One pod = ingester + broker + exporter.
# Disabled in clusters without per-env LB/cert wiring; enabled in values-gke.yaml.
broker:
  enabled: false
  image:
    repository: eclipse-mosquitto
    tag: "2.0.21"
    pullPolicy: IfNotPresent
  # Per-env values injected via inlineValues by argocd/root/templates/trakrf-ingester.yaml.
  hostname: ""
  loadBalancerIP: ""
  # Reflector mirrors this Secret from trakrf-system into per-env namespaces.
  # Created by `just mosquitto-secrets`. Keys:
  #   passwd    — mosquitto password_file (single username:hash line)
  #   username  — literal MQTT username (consumed by ingester + exporter env)
  #   password  — literal MQTT password (same)
  authSecret: trakrf-mosquitto-auth
  # cert-manager-issued TLS cert Secret for the :8883 listener; created by the
  # per-env Certificate resource (templates/certificate.yaml).
  certSecret: trakrf-mqtt-tls
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  exporter:
    enabled: true
    image:
      repository: sapcc/mosquitto-exporter
      tag: "0.8.0"
      pullPolicy: IfNotPresent
    port: 9234
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

# Prometheus metrics exposed by Redpanda Connect's built-in HTTP server.
metrics:
  enabled: true
  port: 4195

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

nodeSelector: {}
tolerations: []
affinity: {}
