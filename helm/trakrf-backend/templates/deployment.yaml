apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trakrf-backend.fullname" . }}
  labels:
    {{- include "trakrf-backend.labels" . | nindent 4 }}
  annotations:
    # Stakater Reloader bounces the backend when a mounted ConfigMap/Secret
    # changes (TRA-907 follow-up) — e.g. the trakrf-mosquitto-auth MQTT creds or
    # the CNPG role secret — so credential rotations don't need a manual restart.
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.mqtt.host }}
  # Single-subscriber guard while MQTT ingestion is on (TRA-907 follow-up).
  # A rollout surge would briefly run two subscribing pods, and both insert
  # asset_scans with their own received_at → distinct (timestamp,org,asset) PKs
  # that ON CONFLICT can't dedup → duplicate rows. maxSurge:0 keeps the rollout
  # to one pod at a time (no overlap) WITHOUT a strategy-type flip: type:Recreate
  # under ArgoCD server-side-diff wedges sync on the live deploy's leftover
  # rollingUpdate block (see feedback_argocd_recreate_strategy_ssa_conflict).
  # MQTT-off envs inherit the chart default surge. $share is the durable fix for
  # both this and steady-state multi-replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "trakrf-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "trakrf-backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "trakrf-backend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Invoke the `serve` subcommand explicitly. The image CMD is just
          # ["/server"] and bare /server hangs after Logger init when env
          # vars are present (reproduced on GKE 1.35.1 COS; likely also on
          # AKS with same image). migrate-job.yaml uses the same explicit
          # form for `/server migrate`.
          command: ["/server", "serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # PG_URL assembled via k8s $(VAR) interpolation from CNPG role secret.
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: password
            - name: PG_URL
              value: "postgresql://{{ .Values.database.user }}:$(PG_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}&options=-c%20search_path%3D{{ .Values.database.searchPath }}"
            {{- if .Values.mqtt.host }}
            # MQTT ingestion subscriber (TRA-920). MQTT_URL is composed via k8s
            # $(VAR) interpolation from the broker auth Secret — no creds in git.
            # MQTT_USER/MQTT_PASSWORD MUST precede MQTT_URL for interpolation.
            # See feedback_k8s_dsn_composition.
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.authSecret }}
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.authSecret }}
                  key: password
            - name: MQTT_URL
              value: "{{ .Values.mqtt.scheme }}://$(MQTT_USER):$(MQTT_PASSWORD)@{{ .Values.mqtt.host }}:{{ .Values.mqtt.port }}"
            - name: MQTT_TOPIC
              value: {{ .Values.mqtt.topic | quote }}
            - name: MQTT_CLIENT_ID
              value: {{ .Values.mqtt.clientId | quote }}
            {{- end }}
            {{- if .Values.readerFeed.url }}
            # Reader live-view feed (TRA-902). The backend stamps these into
            # index.html (window.__APP_CONFIG__.readerFeed); the SPA's Live Reads
            # tab connects the browser to the broker over WSS as the read-only
            # frontend-readonly user. These land in pre-auth index.html (public);
            # password is sourced from the secret (out of git), ACL = subscribe-only.
            - name: READER_FEED_MQTT_URL
              value: {{ .Values.readerFeed.url | quote }}
            - name: READER_FEED_MQTT_USERNAME
              value: {{ .Values.readerFeed.username | quote }}
            - name: READER_FEED_MQTT_TOPIC
              value: {{ .Values.readerFeed.topic | quote }}
            - name: READER_FEED_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.readerFeed.passwordSecret }}
                  key: {{ .Values.readerFeed.passwordSecretKey }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "trakrf-backend.fullname" . }}
            - secretRef:
                name: {{ include "trakrf-backend.fullname" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
