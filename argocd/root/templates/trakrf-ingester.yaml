{{- /*
  One trakrf-ingester Application per env. Per-env config (DB host, MQTT
  broker IP) lives in .Values.envs at the root chart values level — the
  template has zero env-name string conditionals. The ingester has no
  migrate Job and no ingress.

  On non-GKE clusters, envs.<env>.mqttIp is blank and the cluster overlay
  sets broker.enabled=false (values-aks.yaml / values-eks.yaml), so the
  unused broker.* values are harmless.
*/ -}}
{{- range $env, $cfg := $.Values.envs }}
{{- $values := printf "database:\n  name: trakrf\n  user: trakrf-app\n  credentialsSecret: trakrf-app-credentials\n  host: %s\nmqtt:\n  clientId: trakrf-ingester-%s-%s\nbroker:\n  hostname: mqtt.%s.gke.trakrf.id\n  loadBalancerIP: %s\n" $cfg.dbHost $.Values.cluster $env $env $cfg.mqttIp }}
---
{{- include "trakrf.application" (dict
  "name" (printf "trakrf-ingester-%s" $env)
  "path" "helm/trakrf-ingester"
  "namespace" (printf "trakrf-%s" $env)
  "syncWave" "1"
  "cluster" $.Values.cluster
  "repoURL" $.Values.repoURL
  "targetRevision" $.Values.targetRevision
  "destination" $.Values.destination
  "inlineValues" $values
) }}
{{- end }}
