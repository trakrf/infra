{{- /*
  One trakrf-backend Application per env (preview, prod). Each release
  installs into its own namespace and connects to its own Postgres
  database via its own credentials.

  Preview gets ingress + IPAllowList middlewares wired up via the
  trakrf-backend.previewIngressValues helper. Prod stays ingress-off
  pending production cutover (separate ticket).

  On GKE, automatic image-tag promotion for preview is handled by an
  ImageUpdater CR (see trakrf-backend-image-updater.yaml). The chart
  1.2.x controller is CRD-driven, so the Application itself carries no
  image-updater annotations — they would be inert.
*/ -}}
{{- range $env := list "preview" "prod" }}
{{- $dbHost := "trakrf-db-rw.trakrf-system" }}
{{- if eq $env "preview" }}
{{- $dbHost = "trakrf-db-preview-rw.trakrf-preview" }}
{{- end }}
{{- $base := printf "database:\n  name: trakrf_%s\n  user: trakrf-app-%s\n  credentialsSecret: trakrf-app-%s-credentials\n  host: %s\nmigrate:\n  database: trakrf_%s\n  user: trakrf-migrate-%s\n  credentialsSecret: trakrf-migrate-%s-credentials\n  host: %s\nconfig:\n  appEnv: %s\n" $env $env $env $dbHost $env $env $env $dbHost $env }}
{{- $ingress := "ingress:\n  enabled: false\n" }}
{{- if eq $env "preview" }}
{{- $ingress = include "trakrf-backend.previewIngressValues" $ }}
{{- end }}
{{- $values := printf "%s%s" $base $ingress }}
---
{{- include "trakrf.application" (dict
  "name" (printf "trakrf-backend-%s" $env)
  "path" "helm/trakrf-backend"
  "namespace" (printf "trakrf-%s" $env)
  "syncWave" "1"
  "cluster" $.Values.cluster
  "repoURL" $.Values.repoURL
  "targetRevision" $.Values.targetRevision
  "destination" $.Values.destination
  "inlineValues" $values
) }}
{{- end }}
