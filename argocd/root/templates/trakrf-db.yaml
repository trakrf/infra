{{- /*
  Shared trakrf-db Cluster. Hosts the prod DB in trakrf-system until the
  prod-half cutover ticket retires this Cluster and stands up a dedicated
  trakrf-db-prod in trakrf-prod ns.

  Chart defaults are unsuffixed (database=trakrf, roles=trakrf-{app,migrate})
  — same shape as the new trakrf-db-preview release. Only fullnameOverride,
  backups bucket/gsa, and backups.cluster.serverName need overriding.

  automatedPrune=false: stateful guardrail. Combined with the underlying
  PV's reclaimPolicy=Retain (one-time kubectl patch on the existing PV),
  neither an accidental prune nor a Cluster CR delete will destroy data.
*/ -}}
{{- $ignore := "- group: postgresql.cnpg.io\n  kind: Cluster\n  name: trakrf-db\n  managedFieldsManagers:\n    - manager\n" -}}
{{- $values := printf "fullnameOverride: trakrf-db\nbackups:\n  bucket: %q\n  gcpServiceAccountEmail: %q\n" .Values.cnpgBackupBucket .Values.cnpgBackupsGcpServiceAccountEmail -}}
{{- include "trakrf.application" (dict
  "name" "trakrf-db"
  "path" "helm/trakrf-db"
  "namespace" .Values.namespaces.trakrfSystem
  "syncWave" "0"
  "cluster" .Values.cluster
  "repoURL" .Values.repoURL
  "targetRevision" .Values.targetRevision
  "destination" .Values.destination
  "inlineValues" $values
  "ignoreDifferences" $ignore
  "automatedPrune" false
) }}
