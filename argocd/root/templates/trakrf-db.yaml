{{- /* CNPG operator fills runtime defaults on the Cluster spec
       (connectionLimit, inRoles, etc.). Ignore fields owned by the
       operator's field manager to silence cosmetic OutOfSync. */ -}}
{{- /* CNPG's Go client uses the default field manager name "manager".
       Ignoring fields owned by it filters out all operator-filled
       defaults (podAntiAffinityType, connectionLimit, inherit, etc.). */ -}}
{{- $ignore := "- group: postgresql.cnpg.io\n  kind: Cluster\n  name: trakrf-db\n  managedFieldsManagers:\n    - manager\n" -}}
{{- /*
  TRA-810 — On GKE, enable the external LoadBalancer Service for the
  preview CNPG primary so platform CC can iterate on the M3 FDW pull
  migration with direct psql access. The IP is the Tofu-managed static
  address (db_preview_ip output); the source allowlist reuses the same
  breakglass dyn-DNS CIDR that gates the preview ingress.

  Empty inlineValues on AKS/EKS (the chart's externalPreview.enabled is
  false by default) so the Service template only renders on GKE.
*/ -}}
{{- $values := "" -}}
{{- if eq .Values.cluster "gke" -}}
{{- $values = printf "externalPreview:\n  enabled: true\n  loadBalancerIP: %q\n  sourceRanges:\n    - %q\n" .Values.dbPreviewIp .Values.breakglassSourceCidr -}}
{{- end -}}
{{- include "trakrf.application" (dict
  "name" "trakrf-db"
  "path" "helm/trakrf-db"
  "namespace" .Values.namespaces.trakrfSystem
  "syncWave" "0"
  "cluster" .Values.cluster
  "repoURL" .Values.repoURL
  "targetRevision" .Values.targetRevision
  "destination" .Values.destination
  "inlineValues" $values
  "ignoreDifferences" $ignore
) }}
