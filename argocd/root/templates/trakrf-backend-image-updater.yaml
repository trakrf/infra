{{- /*
  ImageUpdater CR for the trakrf-backend preview deployment on GKE.

  The argocd-image-updater chart 1.2.x runs a controller-runtime manager
  that reconciles ImageUpdater CRs — Application annotations are no
  longer consulted. This CR declares the update policy that was
  previously encoded as annotations on the trakrf-backend-preview
  Application.

  Watches the floating `:preview` tag on ghcr.io/trakrf/backend (rebuilt
  by platform docker-build.yml on every preview-branch rewrite); the
  `digest` strategy redeploys whenever the tag's resolved digest changes.

  Write-back is `argocd`: the controller patches the matched Application's
  spec.source.helm.parameters with the resolved digest (sha256:<hex>) as
  image.tag. The chart helper trakrf-backend.image renders <repo>@<digest>
  when it sees the sha256: prefix. The values-gke.yaml image.tag pin is
  the bootstrap value; the live tag lives on the Application until a
  manual override re-asserts (remove the helm parameter and reapply
  values-gke.yaml).

  GKE-only — guarded by .Values.cluster, mirroring the controller
  Application in argocd-image-updater.yaml.

  A separate ImageUpdater CR below (trakrf-backend-prod) tracks prod's
  resolved `:prod` digest (TRA-351 option b) — promote-prod remains the
  sole audited publish gate; image-updater just pins the digest it
  resolves to.
*/ -}}
{{- if eq .Values.cluster "gke" }}
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: trakrf-backend-preview
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  applicationRefs:
    - namePattern: trakrf-backend-preview
      images:
        - alias: backend
          imageName: ghcr.io/trakrf/backend:preview
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
      writeBackConfig:
        method: argocd
---
{{- /*
  ImageUpdater CR for the trakrf-backend PROD deployment on GKE (TRA-351,
  option b — fixes the prod deploy gap found in the 2026-05-30 v1.2.0 dry run).

  WHY prod is now image-updater-tracked (it deliberately was NOT before):
  GKE prod deploys the backend via the floating `:prod` tag with
  imagePullPolicy=IfNotPresent. Re-pointing `:prod` (platform's promote-prod
  imagetools re-tag) does NOT make kubelet re-pull — it reuses the locally
  cached image for the `:prod` ref, so "promote :prod + sync" deploys nothing
  (the migrate hook even runs on the stale cached image — a silent no-op).
  Pinning prod to the resolved DIGEST (sha256:...) makes the ref immutable,
  so kubelet pulls exactly that build — same mechanism preview already uses.

  MODEL: promote-prod stays the SOLE audited "publish :prod" gate. This CR
  watches `:prod` and writes its resolved digest into the prod Application
  whenever that digest changes (i.e. after a promote) — so prod rolls only on
  a deliberate promote, NOT on every upstream push (unlike preview, which
  tracks the continuously-rebuilt `:preview`). Same digest strategy + argocd
  write-back; the chart helper renders <repo>@<digest> on the sha256: prefix.

  NOTE (separate cutover prerequisite, NOT handled here): the post-flatten
  image enforces the #428 JWT_SECRET guard — it refuses to boot in prod on the
  "change-me" placeholder. A real JWT_SECRET must be present in the
  trakrf-prod `trakrf-backend` Secret before/with any flatten roll, or prod
  crashloops. Tracked alongside this under the TRA-351 cutover epic.
*/ -}}
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: trakrf-backend-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  applicationRefs:
    - namePattern: trakrf-backend-prod
      images:
        - alias: backend
          imageName: ghcr.io/trakrf/backend:prod
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
      writeBackConfig:
        method: argocd
{{- end }}
