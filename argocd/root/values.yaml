# === THE TOUCHPOINT ===
# Flip `cluster` to target a different cluster overlay. All other values
# are injected by scripts/apply-root-app.sh from tofu outputs at install time.
# ======================

cluster: aks

repoURL: https://github.com/trakrf/infra.git
targetRevision: main

destination:
  server: https://kubernetes.default.svc

namespaces:
  argocd: argocd
  certManager: cert-manager
  traefik: traefik
  trakrfSystem: trakrf-system
  trakrfPreview: trakrf-preview
  trakrfProd: trakrf-prod

# Per-env workload config consumed by trakrf-backend.yaml + trakrf-ingester.yaml.
# Adding a third env (whitelabel tenant, etc.) means adding a key here and a
# matching CNPG Cluster Application elsewhere — no template edits needed.
#
# dbHost           — DSN host (`<service>.<ns>` form). Prod still resolves to
#                    the shared Cluster in trakrf-system; will flip to
#                    trakrf-db-prod-rw.trakrf-prod when the prod-half ticket
#                    stands up a dedicated Cluster.
# ingressEnabled   — gates the preview-style ingress + IPAllowList block.
#                    Currently only preview routes app.preview.gke.trakrf.id;
#                    prod ingress lands in a separate ticket.
# mqttIp           — per-env MQTT broker LB IP (Tofu-injected by
#                    scripts/apply-root-app.sh on GKE; blank on non-GKE).
#                    Hostname is computed as `mqtt.<env>.gke.trakrf.id`.
envs:
  preview:
    dbHost: trakrf-db-preview-rw.trakrf-preview
    ingressEnabled: true
    mqttIp: ""
  prod:
    dbHost: trakrf-db-rw.trakrf-system
    ingressEnabled: false
    mqttIp: ""

# Tofu output placeholders (populated by scripts/apply-root-app.sh at install time)
certManagerIdentityClientId: ""
tenantId: ""
subscriptionId: ""
dnsZoneResourceGroup: ""
traefikLbIp: ""
mainResourceGroupName: ""

# GKE tofu output placeholders (populated by scripts/apply-root-app.sh at install time)
gcpProjectId: ""
certManagerGcpServiceAccountEmail: ""
cloudDnsZoneNameApp: ""
cloudDnsZoneNameId: ""
# Note: traefikLbIp (above) is shared — both AKS and GKE use it for their static LB IPs.

# CNPG Phase 1 logical backups — populated by scripts/apply-root-app.sh
# from terraform/gcp outputs. Blank on non-GKE clusters; consumed by
# argocd/root/templates/trakrf-db.yaml to set backups.* in the
# trakrf-db chart.
cnpgBackupBucket: ""
cnpgBackupsGcpServiceAccountEmail: ""

# TRA-810 — Preview CNPG primary LB IP (Tofu-injected). GKE-only; consumed
# by argocd/root/templates/trakrf-db-preview.yaml to enable the external
# Service. Hostname is fixed `db.preview.gke.trakrf.id`.
dbPreviewIp: ""

# Preview ingress origin-lock — populated by scripts/apply-root-app.sh.
# breakglassSourceCidr: resolved at apply time from a dyn DNS hostname
#   (currently opsumo-austin.asuscomm.com); formatted as <ip>/32.
# cloudflareIpv{4,6}Cidrs: pulled from terraform/cloudflare outputs that wrap
#   the cloudflare_ip_ranges data source.
breakglassSourceCidr: ""
cloudflareIpv4Cidrs: []
cloudflareIpv6Cidrs: []
